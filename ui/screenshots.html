<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshots — WatchTower</title>
  <meta name="description" content="Visual gallery of captured HTTP services across all programs.">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='64' y2='64'%3E%3Cstop offset='0' stop-color='%2358a6ff'/%3E%3Cstop offset='1' stop-color='%23bc8cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M32 4 L56 14 L56 34 C56 48 44 58 32 62 C20 58 8 48 8 34 L8 14 Z' stroke='url(%23g)' stroke-width='3' fill='none'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="brand">
        <svg class="brand-logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="brand-g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#58a6ff"/>
              <stop offset="1" stop-color="#bc8cff"/>
            </linearGradient>
          </defs>
          <path d="M32 4 L56 14 L56 34 C56 48 44 58 32 62 C20 58 8 48 8 34 L8 14 Z"
                stroke="url(#brand-g)" stroke-width="3" fill="none" stroke-linejoin="round"/>
          <rect x="26" y="28" width="12" height="20" rx="2"
                stroke="url(#brand-g)" stroke-width="3" fill="none"/>
          <path d="M22 28 L42 28 L38 20 L26 20 Z"
                stroke="url(#brand-g)" stroke-width="3" fill="none" stroke-linejoin="round"/>
          <path d="M32 20 L32 12" stroke="url(#brand-g)" stroke-width="3" stroke-linecap="round"/>
          <circle cx="32" cy="10" r="2" fill="url(#brand-g)"/>
        </svg>
        <span class="brand-name">WatchTower</span>
      </a>

      <nav class="header-nav">
        <a href="/programs">Programs</a>
        <a href="/cdn">CDN</a>
        <a href="/portscan">Ports</a>
        <a href="/screenshots">Screenshots</a>
        <a href="/nuclei">Nuclei</a>
        <a href="/help">Help</a>
      </nav>

      <div class="header-actions">
        <span class="version-badge">v1.0</span>
        <span class="live-dot" title="Live"></span>
      </div>
    </div>
  </header>

  <!-- ============ MAIN ============ -->
  <main class="container">

    <div class="page-header">
      <div class="page-title-group">
        <a href="/" class="back-link">← Dashboard</a>
        <h1 class="page-title">
          📸 Screenshots
          <span class="page-count-badge" id="count-badge">—</span>
        </h1>
        <p class="page-subtitle">Visual gallery of captured HTTP services across all programs</p>
      </div>
    </div>

    <div class="toolbar">
      <div class="toolbar-group">
        <label class="toolbar-label" for="filter-program">Program</label>
        <select id="filter-program">
          <option value="">All</option>
        </select>
      </div>

      <div class="toolbar-group">
        <label class="toolbar-label" for="filter-cdn">CDN</label>
        <select id="filter-cdn">
          <option value="all">All</option>
          <option value="cdn">CDN only</option>
          <option value="direct">Direct only</option>
          <option value="unknown">Unknown</option>
        </select>
      </div>

      <div class="toolbar-group">
        <label class="toolbar-label" for="sort-field">Sort</label>
        <select id="sort-field">
          <option value="host-asc">Host (A → Z)</option>
          <option value="host-desc">Host (Z → A)</option>
          <option value="last_seen-desc">Last Seen (Newest)</option>
          <option value="last_seen-asc">Last Seen (Oldest)</option>
          <option value="status_code-asc">Status (Low → High)</option>
          <option value="status_code-desc">Status (High → Low)</option>
        </select>
      </div>

      <div class="toolbar-group">
        <label class="toolbar-label" for="page-size">Per page</label>
        <select id="page-size">
          <option value="24">24</option>
          <option value="48">48</option>
          <option value="96">96</option>
        </select>
      </div>

      <div class="toolbar-spacer"></div>

      <input id="filter-search" class="toolbar-search" type="text" placeholder="Search host, URL, tech…" autocomplete="off">
    </div>

    <div class="loading-state" id="loading-state">
      <div class="spinner"></div>
      <div>Loading screenshots…</div>
    </div>

    <div class="gallery" id="gallery"></div>

    <div id="pagination-container"></div>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>WatchTower &copy; 2026 — Automated Reconnaissance Dashboard</p>
    </div>
  </footer>

  <!-- Image modal -->
  <div class="modal" id="screenshot-modal">
    <div class="modal-content">
      <button class="modal-close" aria-label="Close">&times;</button>
      <div class="modal-image-wrap">
        <img class="modal-image" src="" alt="">
      </div>
      <div class="modal-caption"></div>
    </div>
  </div>

  <script src="/static/js/main.js"></script>
  <script src="/static/js/screenshots.js"></script>
</body>
</html>
